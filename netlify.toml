# Netlify build config for Sterlin Glams Logistics (Next.js + Firebase).
# Mirrors the old Vercel setup: pnpm install (non-frozen), the Next.js runtime, and the daily
# audit-log prune cron (moved to a Netlify Scheduled Function — see netlify/functions/).

[build]
  command = "pnpm build"

[build.environment]
  # Next 15 + pnpm 9 need a modern Node.
  NODE_VERSION = "20"
  # Corepack picks pnpm from package.json "packageManager"; match Vercel's non-frozen install so a
  # slightly out-of-date lockfile doesn't fail the build.
  PNPM_FLAGS = "--no-frozen-lockfile"
  # NEXT_PUBLIC_* values are compiled into the client bundle BY DESIGN (Firebase web config, the Maps
  # key, the public site origin). They are not secrets, so tell Netlify's secret scanner not to fail the
  # build when it finds them in the output. Real secrets (service account, Twilio, Resend, Upstash,
  # CRON/driver/webhook secrets) are NOT listed here and stay scanned.
  # STORE_DELIVERED_WEBHOOK_URL is just the store's public callback URL (not a secret) and is documented
  # in STERLINGLAMS_STORE_SETUP.md, so the scanner flags it — allow it. (STORE_WEBHOOK_SECRET stays scanned.)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_ORIGIN,NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_HUB_LAT,NEXT_PUBLIC_HUB_LNG,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_GOOGLE_MAPS_KEY,NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID,STORE_DELIVERED_WEBHOOK_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
